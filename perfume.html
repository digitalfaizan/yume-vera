<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfumes — Yume Vera</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <div id="header"></div>


    <main>

        <!-- =========================
             COLLECTION HERO
        ========================== -->

        <section class="perfumes-hero">

            <div class="perfumes-hero-content">

                <p class="section-label">
                    THE YUME VERA COLLECTION
                </p>

                <h1>
                    FIND YOUR<br>
                    SIGNATURE.
                </h1>

                <p>
                    Discover fragrances crafted to become
                    part of your identity.
                </p>

            </div>

        </section>


        <!-- =========================
             PRODUCTS
        ========================== -->

        <section class="all-perfumes">

            <div class="perfumes-heading">

                <div>

                    <p class="section-label">
                        EXPLORE THE COLLECTION
                    </p>

                    <h2>
                        OUR PERFUMES
                    </h2>

                </div>

                <span class="perfume-count">
                    9 FRAGRANCES
                </span>

            </div>


            <div
                class="all-products-grid"
                id="all-products"
            ></div>

        </section>


    </main>


    <!-- FOOTER -->

    <div id="footer"></div>


    <script src="js/products.js"></script>
    <script src="js/perfumes.js"></script>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
