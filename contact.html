<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Contact — Yume Vera</title>
</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>


    <main>

        <!-- =========================
             CONTACT HERO
        ========================== -->

        <section class="contact-hero">

            <div class="contact-hero-content">

                <p class="section-label">
                    GET IN TOUCH
                </p>

                <h1>
                    LET'S<br>
                    TALK.
                </h1>

                <p>
                    Have a question about a fragrance,
                    your order, or creating your own perfume?
                    We're here to help.
                </p>

            </div>

        </section>


        <!-- =========================
             CONTACT AREA
        ========================== -->

        <section class="contact-section">

            <!-- LEFT -->

            <div class="contact-info">

                <p class="section-label">
                    CONTACT
                </p>

                <h2>
                    WE'D LOVE<br>
                    TO HEAR<br>
                    FROM YOU.
                </h2>


                <div class="contact-details">

                    <div class="contact-detail">

                        <span>
                            EMAIL
                        </span>

                        <a href="mailto:hello@yumevera.com">
                            hello@yumevera.com
                        </a>

                    </div>


                    <div class="contact-detail">

                        <span>
                            INSTAGRAM
                        </span>

                        <a href="#">
                            @yumevera
                        </a>

                    </div>


                    <div class="contact-detail">

                        <span>
                            RESPONSE TIME
                        </span>

                        <p>
                            We usually respond within
                            24–48 hours.
                        </p>

                    </div>

                </div>

            </div>


            <!-- RIGHT -->

            <div class="contact-form-wrapper">

                <p class="section-label">
                    SEND A MESSAGE
                </p>


                <form class="contact-form">

                    <div class="form-group">

                        <label for="name">
                            NAME
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="YOUR NAME"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="YOUR EMAIL"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            SUBJECT
                        </label>

                        <select id="subject" name="subject">

                            <option value="">
                                SELECT A SUBJECT
                            </option>

                            <option value="order">
                                ORDER
                            </option>

                            <option value="perfume">
                                PERFUME
                            </option>

                            <option value="custom">
                                CUSTOM PERFUME
                            </option>

                            <option value="other">
                                OTHER
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="message">
                            MESSAGE
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="YOUR MESSAGE"
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        SEND MESSAGE
                    </button>

                </form>

            </div>

        </section>


    </main>


    <!-- FOOTER -->
    <div id="footer"></div>


    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
