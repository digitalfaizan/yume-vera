<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yume Vera</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <div id="header"></div>


    <!-- PRODUCT -->

    <main>

        <section class="product-page">

            <div class="product-page-images">

                <div class="product-main-image">
                    <img id="product-main-image" src="" alt="">
                </div>

                <div class="product-thumbnails" id="product-thumbnails">
                </div>

            </div>


            <div class="product-page-info">

                <p class="product-page-label">
                    YUME VERA
                </p>

                <h1 id="product-name">
                </h1>

                <p id="product-inspiration" class="product-inspiration">
                </p>


                <div class="product-divider"></div>


                <p id="product-description" class="product-description">
                </p>


                <div class="product-details">

                    <div>
                        <span>SIZE</span>
                        <strong id="product-size"></strong>
                    </div>

                    <div>
                        <span>TYPE</span>
                        <strong>EAU DE PARFUM</strong>
                    </div>

                </div>


                <div class="product-price">

                    <span id="product-price"></span>

                    <small>
                        + SHIPPING
                    </small>

                </div>


                <div class="quantity">

                    <button id="quantity-minus">
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button id="quantity-plus">
                        +
                    </button>

                </div>


                <button class="buy-now" id="buy-now">
                    BUY NOW
                </button>


                <button class="add-to-cart" id="add-to-cart">
                    ADD TO CART
                </button>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <div id="footer"></div>


    <script src="js/products.js"></script>
    <script src="js/product.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
