<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Bag — Yume Vera</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">

</head>


<body>

    <!-- HEADER -->

    <div id="header"></div>


    <main>

        <!-- =========================
             CART — HAS ITEMS
        ========================== -->

        <section class="cart-section" id="cart-section">

            <div class="cart-container">

                <!-- LEFT: BAG -->

                <div class="cart-items-col">

                    <p class="section-label">
                        YOUR BAG
                    </p>

                    <h1 class="cart-title">
                        SHOPPING BAG
                    </h1>

                    <div class="cart-items" id="cart-items">
                        <!-- Cart items injected by js/cart.js -->
                    </div>

                </div>


                <!-- RIGHT: SUMMARY -->

                <aside class="cart-summary">

                    <h2 class="cart-summary-title">
                        ORDER SUMMARY
                    </h2>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">₹0</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span id="cart-shipping">₹0</span>
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span id="cart-total">₹0</span>
                    </div>

                    <button
                        type="button"
                        class="btn btn-primary cart-checkout-btn"
                        id="checkout-btn"
                    >
                        PROCEED TO CHECKOUT
                    </button>

                    <a href="perfumes.html" class="text-link cart-continue-link">
                        CONTINUE SHOPPING
                    </a>

                </aside>

            </div>

        </section>


        <!-- =========================
             CART — EMPTY STATE
        ========================== -->

        <section class="cart-empty" id="cart-empty" hidden>

            <p class="section-label">
                YOUR BAG
            </p>

            <h1>
                YOUR CART<br>
                IS EMPTY.
            </h1>

            <p class="cart-empty-text">
                Your signature scent is waiting.
            </p>

            <a href="perfumes.html" class="btn btn-primary">
                EXPLORE PERFUMES
            </a>

        </section>

    </main>


    <!-- FOOTER -->

    <div id="footer"></div>


    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
